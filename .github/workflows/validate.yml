name: Validate desktop builds

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            bundle: appimage
          - name: Linux DEB
            os: ubuntu-22.04
            bundle: deb
          - name: Linux RPM
            os: ubuntu-22.04
            bundle: rpm
          - name: Windows
            os: windows-latest
            bundle: nsis

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy -- -D warnings

      - name: Test Rust
        run: cargo test

      - name: Build Tauri bundle
        run: npm exec tauri -- build --config src-tauri/tauri.conf.json --config src-tauri/tauri.ci.conf.json --bundles ${{ matrix.bundle }}
