name: Build test installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb,rpm
            artifact: bebop-linux-x64-test
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            artifact: bebop-windows-x64-test

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # Unsigned, ad-hoc build for local testing: no updater signature, and
      # on Windows the WebView2 runtime is bundled offline so the installer
      # needs no internet access or preinstalled WebView2 on the test
      # machine. Not the signed release pipeline (see release.yml).
      - name: Build Tauri bundle (unsigned test build)
        run: npm exec tauri -- build --config src-tauri/tauri.conf.json --config src-tauri/tauri.test-build.conf.json --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
