[package]
name = "bebop-desktop"
version = "0.1.0"
description = "Bebop local-first desktop music player"
authors = ["Daniel Goodman"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "bebop_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "bebop-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
crossbeam-queue = "0.3.13"
lofty = "=0.22.4"
notify = "=8.2.0"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "flac", "mp3", "mp4", "symphonia-aiff", "symphonia-alac", "vorbis", "wav"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["backup", "bundled"] }
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
symphonia = { version = "0.5.4", features = ["all"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
tempfile = "3.22.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"
